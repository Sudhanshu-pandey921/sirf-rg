trigger: 
 - main

pool: may-pool

stages:
  - stage: firststage
    displayName: init
    jobs:
      - job: terraforminit
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'may-sc'
              backendAzureRmStorageAccountName: 'rajustg12'
              backendAzureRmContainerName: 'rajucnt12'
              backendAzureRmKey: 'raju.tfstate'

  - stage: secondstage
    displayName: plan
    jobs:
      - job: terraformplan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'may-sc'
              backendAzureRmStorageAccountName: 'rajustg12'
              backendAzureRmContainerName: 'rajucnt12'
              backendAzureRmKey: 'raju.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'may-sc'


  - stage: laststage
    displayName: apply
    jobs:
      - job: terraformapply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'may-sc'
              backendAzureRmStorageAccountName: 'rajustg12'
              backendAzureRmContainerName: 'rajucnt12'
              backendAzureRmKey: 'raju.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: '-auto-approve'
              environmentServiceNameAzureRM: 'may-sc'
          
          
          